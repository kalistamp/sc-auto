<meta name="color-scheme" content="light dark">
<meta name="description" content="Private drafting, review, and publication record for Safe Cycle Tech social posts.">
<title>Safe Cycle Studio</title>

<!-- Theme bootstrap. Runs before the stylesheet paints so a dark-mode visitor
     never gets a white flash. js/theme.js owns the toggle; this is a
     deliberate duplicate of just enough logic to beat first paint. -->
<script>
(function () {
    try {
        var saved = localStorage.getItem('sct.theme');       // 'light' | 'dark' | 'system'
        var dark = saved === 'dark' || ((!saved || saved === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('theme-dark');
    } catch (e) {}
})();
</script>

<!-- MODULE VERSIONING — the whole graph, not just the entry point.

     The <script> at the foot of this file carries a build query, which
     reliably defeats the cache for that ONE file. But app.js then does
     `import ... from "./data.js"`, and that specifier has no version on it,
     so the browser is free to answer it out of cache. After a deploy that
     produces a fresh app.js linked against a stale data.js — and if an
     export was added or renamed in between, the module graph fails to LINK.

     That failure mode is silent and total: a link error means not one line
     of app.js runs, so no event listeners are attached, and the passkey
     gate below renders as static HTML with a dead Unlock button. It has
     happened once already. It cost an afternoon to diagnose.

     This import map rewrites every module URL to carry the build stamp, so
     one deploy invalidates the entire graph atomically. Keys are relative
     so the app still works when served from a subdirectory, which is how
     GitHub Pages usually serves it.

     Bump these with the other four build stamps; tests/boot.test.mjs fails
     if this map misses a module in js/ or falls behind BUILD. -->
<script type="importmap">
{
  "imports": {
    "./js/config.js":    "./js/config.js?v=3.3.0",
    "./js/data.js":      "./js/data.js?v=3.3.0",
    "./js/platforms.js": "./js/platforms.js?v=3.3.0",
    "./js/providers.js": "./js/providers.js?v=3.3.0",
    "./js/settings.js":  "./js/settings.js?v=3.3.0",
    "./js/sync.js":      "./js/sync.js?v=3.3.0",
    "./js/theme.js":     "./js/theme.js?v=3.3.0",
    "./js/ui.js":        "./js/ui.js?v=3.3.0",
    "./js/voice.js":     "./js/voice.js?v=3.3.0"
  }
}
</script>

<!-- BOOT WATCHDOG — turns a silent failure into an instruction.

     The import map above prevents the stale-module case going forward, but
     it cannot help a browser that is ALREADY holding a broken mix, and it
     does nothing on a browser without import map support. Either way the
     symptom is the same: the gate renders and the button does nothing,
     with the real error visible only in the console.

     So: app.js sets this flag as its first act. If it has not been set by
     the time the timer fires, the modules did not run, and the gate says so
     in plain language instead of appearing merely broken. Deliberately a
     classic script, not a module — it has to survive whatever stopped the
     module graph from loading. -->
<script>
window.__sctBooted = false;
window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
        if (window.__sctBooted) return;
        var msg = document.getElementById('gate-msg');
        var btn = document.getElementById('gate-btn');
        if (!msg) return;
        msg.className = 'gate-msg is-bad';
        msg.textContent = 'This page loaded an out-of-date copy of itself, so the passkey cannot work yet. Reload bypassing the cache: Ctrl+Shift+R, or Cmd+Shift+R on a Mac.';
        if (btn) { btn.disabled = true; btn.textContent = 'Reload to continue'; }
    }, 5000);
});
</script>

<link rel="stylesheet" href="styles.css?v=3.3.0">
<!-- Fonts are self-hosted in assets/fonts and declared in styles.css. No
     third-party font CDN: a Google Fonts link would hand the IP and
     referring page of every visitor to another company, which is not what
     "runs entirely in your browser" should mean. Preloaded because the
     stylesheet only reveals them one round trip later. -->
<link rel="preload" href="assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
</head>

<!-- ============================================================
     PASSKEY GATE
     A privacy latch, not a security boundary — this site is public
     files. What actually protects the workspace is the GitHub token
     entered per device, which never leaves that browser.
     ============================================================ -->
<div id="gate" class="gate">
  <div class="gate-card" id="gate-card">
    <div class="gate-mark" aria-hidden="true"><svg class="ico"><use href="#i-lock"></use></svg></div>
    <h1>Safe Cycle <em>Studio</em></h1>
    <p class="gate-sub">Draft, review, and record every post.</p>

    <form id="gate-form" autocomplete="off">
      <label class="sr-only" for="passkey">Passkey</label>
      <input type="password" id="passkey" placeholder="Passkey" autocomplete="current-password" spellcheck="false" autofocus>
      <button type="submit" class="btn btn-primary btn-block" id="gate-btn">Unlock</button>
    </form>
    <p id="gate-msg" class="gate-msg" role="status" aria-live="polite"></p>
  </div>
  <p class="gate-foot">Safe Cycle Tech · content operations</p>
</div>

<!-- ============================================================
     APP SHELL
     The chrome is static HTML and only #view is re-rendered. That is
     what keeps a caret, a scroll position, and a text selection alive
     while the workspace saves in the background.
     ============================================================ -->
<div id="app" class="app" hidden>

  <aside class="sidebar" id="sidebar" aria-label="Workspace sections">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg class="ico"><use href="#i-refresh"></use></svg></span>
      <span class="brand-name">Safe Cycle <em>Studio</em><small>Content operations</small></span>
    </div>

    <nav class="nav" aria-label="Primary">
      <button class="nav-btn" type="button" data-nav="overview"><svg class="ico"><use href="#i-home"></use></svg><span>Overview</span></button>
      <button class="nav-btn" type="button" data-nav="compose"><svg class="ico"><use href="#i-spark"></use></svg><span>New draft</span></button>
      <button class="nav-btn" type="button" data-nav="library"><svg class="ico"><use href="#i-library"></use></svg><span>Library</span><span class="nav-count" id="count-library"></span></button>
      <button class="nav-btn" type="button" data-nav="queue"><svg class="ico"><use href="#i-calendar"></use></svg><span>Queue</span><span class="nav-count" id="count-queue"></span></button>
      <button class="nav-btn" type="button" data-nav="runs"><svg class="ico"><use href="#i-activity"></use></svg><span>Model runs</span></button>
      <button class="nav-btn" type="button" data-nav="settings"><svg class="ico"><use href="#i-gear"></use></svg><span>Settings</span></button>
    </nav>

    <span class="spacer"></span>

    <div class="side-foot">
      <button class="side-stat" type="button" id="side-sync" data-act="sync-settings">
        <span class="side-stat-label">Workspace</span>
        <strong id="side-mode"><i class="dot"></i><span>This device</span></strong>
        <small id="side-stamp">not connected</small>
      </button>
      <button class="side-stat" type="button" id="side-model" data-act="sync-settings">
        <span class="side-stat-label">Drafting model</span>
        <strong id="side-model-name">Not configured</strong>
        <small id="side-model-provider">Add a key to generate</small>
      </button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <button class="icon-btn only-narrow" type="button" id="menu-btn" aria-label="Open sections" aria-expanded="false">
        <svg class="ico"><use href="#i-menu"></use></svg>
      </button>

      <div class="topbar-title">
        <h1 id="view-title">Overview</h1>
        <p id="view-sub">Everything waiting on you</p>
      </div>

      <span class="spacer"></span>

      <button id="sync-pill" class="sync-pill" type="button" title="Sync now">
        <svg class="ico"><use href="#i-check"></use></svg>
        <span id="sync-text">Saved</span>
      </button>

      <button class="icon-btn" type="button" id="theme-btn" title="Theme" aria-label="Change theme">
        <svg class="ico ico-sun"><use href="#i-sun"></use></svg>
        <svg class="ico ico-moon"><use href="#i-moon"></use></svg>
      </button>

      <button class="icon-btn" type="button" data-act="sync-settings" title="Cloud sync settings" aria-label="Cloud sync settings">
        <svg class="ico"><use href="#i-gear"></use></svg>
      </button>

      <button class="icon-btn" type="button" id="lock-btn" title="Lock studio" aria-label="Lock studio">
        <svg class="ico"><use href="#i-signout"></use></svg>
      </button>

      <!-- The one primary action, present on every view. The label drops
           on a narrow screen and the icon carries it. -->
      <button class="btn btn-primary" type="button" data-nav="compose" title="New draft">
        <svg class="ico"><use href="#i-plus"></use></svg><span class="only-wide">New draft</span>
      </button>
    </header>

    <div id="banner" class="banner" hidden>
      <svg class="ico"><use href="#i-alert"></use></svg>
      <span id="banner-text"></span>
      <button id="banner-action" class="btn btn-ghost btn-sm" type="button" hidden></button>
      <button id="banner-close" class="banner-x" type="button" aria-label="Dismiss"><svg class="ico"><use href="#i-x"></use></svg></button>
    </div>

    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="scrim" class="scrim" hidden></div>

<!-- Generic modal. Content is written per use; the shell, focus trap and
     Esc handling are the browser's, which is why this is a <dialog>. -->
<dialog id="modal" class="modal"></dialog>
<dialog id="confirm" class="modal modal-sm"></dialog>

<div id="toast" class="toast" hidden role="status" aria-live="polite">
  <span id="toast-text"></span>
  <button id="toast-action" class="toast-action" type="button" hidden></button>
</div>

<script type="module" src="js/app.js?v=3.3.0"></script>
</body>
</html>
